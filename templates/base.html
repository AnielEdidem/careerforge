
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerForge AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f5f6fa;
            color: #111827;
        }

        /* NAVBAR */
        .cf-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 72px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid #e8e8ef;
        }

        .cf-nav-inner {
            max-width: 1180px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* BRAND */
        .cf-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #111827;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.4px;
        }

        .cf-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #6d3df5, #8b5cf6);
            color: white;
            font-size: 19px;
            font-weight: 900;

            box-shadow: 0 7px 18px rgba(109, 61, 245, 0.22);
        }

        /* LINKS */
        .cf-nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .cf-nav-links a {
            text-decoration: none;
            color: #667085;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .cf-nav-links a:hover {
            color: #6d3df5;
        }

        /* CTA */
        .cf-nav-cta {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;

            padding: 11px 18px;
            border-radius: 10px;

            background: #6d3df5 !important;
            color: white !important;

            box-shadow: 0 7px 18px rgba(109, 61, 245, 0.2);
        }

        .cf-nav-cta:hover {
            background: #5b2fe0 !important;
            transform: translateY(-1px);
        }

        /* LOGOUT */
        .cf-logout {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;
            border-radius: 10px;

            background: #f3f4f6;
            color: #374151 !important;

            border: 1px solid #e5e7eb;

            transition: 0.2s ease;
        }

        .cf-logout:hover {
            background: #fee2e2;
            color: #b42318 !important;
            border-color: #fecaca;
        }

        /* LOGIN */
        .cf-login {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;
            border-radius: 10px;

            background: #f3f4f6;
            color: #374151 !important;

            border: 1px solid #e5e7eb;
        }

        .cf-login:hover {
            background: #e9e5ff;
            color: #6d3df5 !important;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            .cf-navbar {
                height: 64px;
            }

            .cf-nav-inner {
                padding: 0 16px;
            }

            .cf-nav-links {
                gap: 8px;
            }

            .cf-nav-links a:not(.cf-nav-cta):not(.cf-logout):not(.cf-login) {
                display: none;
            }

            .cf-brand {
                font-size: 16px;
            }

            .cf-brand-icon {
                width: 34px;
                height: 34px;
            }

            .cf-nav-cta,
            .cf-logout,
            .cf-login {
                padding: 9px 12px;
                font-size: 13px !important;
            }
        }
    </style>
</head>

<body>

    <nav class="cf-navbar">
        <div class="cf-nav-inner">

            <a href="/" class="cf-brand">
                <span class="cf-brand-icon">C</span>
                <span>CareerForge</span>
            </a>

            <div class="cf-nav-links">

                <a href="/">
                    How it works
                </a>

                <a href="/">
                    Pricing
                </a>

                <a href="/" class="cf-nav-cta">
                    Build my CV →
                </a>

                {% if user.is_authenticated %}

                    <a href="{% url 'cv:logout' %}" class="cf-logout">
                        Logout
                    </a>

                {% else %}

                    <a href="{% url 'cv:login' %}" class="cf-login">
                        Login
                    </a>

                {% endif %}

            </div>

        </div>
    </nav>


    {% block content %}
    {% endblock %}

</body>
</html>
