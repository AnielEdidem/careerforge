<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Log In | CareerForge</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont,
                     "Segoe UI", sans-serif;
        background: #f5f6fa;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
    }

    .auth-container {
        width: 100%;
        max-width: 440px;
    }

    .brand {
        text-align: center;
        margin-bottom: 25px;
    }

    .brand-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 14px;
        background: linear-gradient(135deg, #6d3df5, #8b5cf6);

        color: white;
        font-size: 22px;
        font-weight: 800;

        box-shadow: 0 10px 25px rgba(109, 61, 245, 0.22);
    }

    .brand h1 {
        margin: 0;
        font-size: 24px;
        color: #111827;
    }

    .brand p {
        margin: 7px 0 0;
        color: #667085;
        font-size: 14px;
    }

    .auth-card {
        background: white;
        border: 1px solid #e8e8ef;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 20px 50px rgba(16, 24, 40, 0.08);
    }

    .auth-card h2 {
        margin: 0 0 7px;
        font-size: 24px;
        color: #111827;
    }

    .subtitle {
        margin: 0 0 25px;
        color: #667085;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
        color: #344054;
    }

    .form-group input {
        width: 100%;
        padding: 13px 14px;

        border: 1px solid #d0d5dd;
        border-radius: 10px;

        font-size: 15px;
        outline: none;

        transition: 0.2s ease;
    }

    .form-group input:focus {
        border-color: #6d3df5;
        box-shadow: 0 0 0 3px rgba(109, 61, 245, 0.10);
    }

    .error-message {
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fff1f2;
        color: #b42318;
        font-size: 13px;
    }

    .submit-btn {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 14px;

        background: #6d3df5;
        color: white;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;
        transition: 0.2s ease;
    }

    .submit-btn:hover {
        background: #5b2fe0;
        transform: translateY(-1px);
    }

    .bottom-text {
        text-align: center;
        margin: 22px 0 0;
        font-size: 14px;
        color: #667085;
    }

    .bottom-text a {
        color: #6d3df5;
        font-weight: 700;
        text-decoration: none;
    }

    .bottom-text a:hover {
        text-decoration: underline;
    }

    .back-home {
        display: block;
        text-align: center;
        margin-top: 18px;

        color: #667085;
        text-decoration: none;
        font-size: 13px;
    }

    .back-home:hover {
        color: #6d3df5;
    }

    @media (max-width: 500px) {
        .auth-card {
            padding: 25px 20px;
        }
    }
</style>


</head>

<body>

<div class="auth-container">


<div class="brand">
    <div class="brand-icon">C</div>
    <h1>CareerForge</h1>
    <p>Build a CV that gets you noticed.</p>
</div>

<div class="auth-card">

    <h2>Welcome back</h2>

    <p class="subtitle">
        Log in to continue building your professional CV.
    </p>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="submit-btn">
            Log In →
        </button>

    </form>

    <p class="bottom-text">
        Don't have an account?
        <a href="{% url 'cv:register' %}">Create one</a>
    </p>

</div>

{% comment %} <a href="{% url 'cv:home' %}" class="back-home">
    ← Back to CareerForge
</a> {% endcomment %}


</div>

</body>
</html>
